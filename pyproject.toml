[project]
name = "fe-tp"
version = "1.0.0"
description = "TD « Feature engineering » (AMA, module 14) : quatre approches comparées sur les annulations de réservations d'hôtel, et un feature store Feast"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=2.0,<3",
    "pyarrow>=16.1",
    "scikit-learn>=1.9",
    "matplotlib>=3.9",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "duckdb>=1.1",
    "feast>=0.60",
]

[dependency-groups]
dev = ["nbclient>=0.10", "nbformat>=5.10", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fe_tp"]

[tool.ruff]
line-length = 110
